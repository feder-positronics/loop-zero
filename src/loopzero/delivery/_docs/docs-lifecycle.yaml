{
  "schema_version": "2.0.0",
  "generated_at": "2026-03-10",
  "description": "Docs lifecycle policy SSoT for metadata validation and archive eligibility. Active doc taxonomy excludes retired spec tombstones under docs/design/specs/ and archived legacy specs under docs/archive/specs/.",
  "validation": {
    "required_fields": [
      "owner",
      "last_updated",
      "status",
      "doc_type"
    ],
    "exclude_paths": [
      "docs/archive/**",
      "docs/templates/**",
      "docs/design/specs/**"
    ]
  },
  "freeze": {
    "minimum_age_days": 14,
    "unfreeze_marker": "<!-- docs-freeze: unfreeze -->",
    "rules": [
      {
        "path": "docs/design/blueprints/completed/**",
        "doc_type": "blueprint",
        "statuses": [
          "completed",
          "superseded"
        ]
      },
      {
        "path": "docs/design/explorations/**",
        "doc_type": "exploration",
        "statuses": [
          "graveyarded"
        ]
      }
    ]
  },
  "graveyard": {
    "minimum_age_days": 30,
    "source_path": "docs/design/explorations",
    "target_path": "docs/design/graveyard.md",
    "eligible_statuses": [
      "draft",
      "completed",
      "superseded"
    ]
  },
  "archive": {
    "manifest_output": "tmp/docs-archive-candidates.json",
    "default_min_age_days": 30,
    "tombstone_root": "docs/archive/historical",
    "tombstone_prefix": "Archived: [historical copy]"
  },
  "statuses": {
    "_comment": "Universal statuses are the shared non-learning vocabulary pool. Domain-specific statuses are opt-in for their owning type. Learning has a dedicated lifecycle.",
    "universal": [
      "draft",
      "active",
      "completed",
      "archived",
      "deprecated",
      "superseded"
    ],
    "domain": {
      "blueprint": [
        "planned",
        "gated"
      ],
      "exploration": [
        "graveyarded"
      ],
      "adr": [
        "proposed",
        "accepted"
      ],
      "architecture": [
        "accepted"
      ]
    },
    "learning": [
      "open",
      "proposed",
      "implemented",
      "archived"
    ]
  },
  "doc_types": {
    "adr": {
      "allowed_statuses": [
        "proposed",
        "accepted",
        "superseded"
      ],
      "archive": {
        "eligible": false,
        "digest": null,
        "exclude_if": [
          "always_reference"
        ],
        "blockers": [
          "never_delete_by_policy"
        ]
      }
    },
    "architecture": {
      "allowed_statuses": [
        "active",
        "deprecated",
        "accepted",
        "superseded",
        "completed",
        "archived"
