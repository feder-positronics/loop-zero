name: checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install bubblewrap for the sandbox test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint
        run: uv run --python 3.14 --group dev ruff check src tests
      - name: Tests
        run: uv run --python 3.14 --group dev pytest -q
      - name: Size budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git fetch -q --depth=1 origin "$BASE_SHA"
          scripts/size_budget.sh "$BASE_SHA"
      - name: Wheel builds and CLI runs
        run: |
          uv build --wheel -q
          uv run --python 3.14 --isolated --with dist/*.whl loopzero --help
