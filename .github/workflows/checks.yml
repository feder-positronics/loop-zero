name: checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install bubblewrap for the sandbox test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint
        run: uv run --python 3.14 --group dev ruff check src tests
      - name: Tests
        run: uv run --python 3.14 --group dev pytest -q
      - name: Size budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # Caps are absolute. A candidate over a cap fails only if it also grew
          # against its base, so a repository that is already over can still
          # merge changes that hold or shrink and never deadlocks.
          count() { git ls-tree -r --name-only "$1" -- "$2" | grep '\.py$' \
            | while read -r f; do git show "$1:$f"; done | wc -l; }
          git fetch -q --depth=1 origin "$BASE_SHA"
          src=$(count HEAD src/loopzero); tests=$(count HEAD tests)
          base_src=$(count "$BASE_SHA" src/loopzero); base_tests=$(count "$BASE_SHA" tests)
          echo "src=$src (base $base_src, delta $((src-base_src)), cap 3000)"
          echo "tests=$tests (base $base_tests, delta $((tests-base_tests)), cap 3800)"
          { test "$src" -le 3000 || test "$src" -le "$base_src"; } \
            && { test "$tests" -le 3800 || test "$tests" -le "$base_tests"; }
      - name: Wheel builds and CLI runs
        run: |
          uv build --wheel -q
          uv run --python 3.14 --isolated --with dist/*.whl loopzero --help
