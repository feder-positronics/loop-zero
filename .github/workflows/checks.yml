name: deterministic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install validation sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Let the runner user create its sandbox on this disposable Ubuntu VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Resolve the development environment outside the sandbox
        run: |
          uv python install "${{ matrix.python }}"
          uv sync --python "${{ matrix.python }}" --group dev --no-install-project
      - name: Validate without parent Git write authority
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bwrap --unshare-user --unshare-net --ro-bind / / --tmpfs /tmp --dev /dev --proc /proc \
            --ro-bind "$GITHUB_WORKSPACE" /tmp/workspace \
            --uid "$(id -u)" --gid "$(id -g)" --cap-drop ALL --clearenv \
            --setenv PATH /usr/bin:/bin --setenv PYTHONDONTWRITEBYTECODE 1 --setenv HOME /tmp \
            --setenv CHECK_BASE "$CHECK_BASE" --setenv CHECK_HEAD "$CHECK_HEAD" \
            --chdir /tmp/workspace -- bash -eu -c '
              .venv/bin/python -m pytest -q -p no:cacheprovider
              .venv/bin/python core/tools/status.py --known-gaps KNOWN-GAPS.md --check-child-env
              base="$CHECK_BASE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base=$(git -c safe.directory=/tmp/workspace hash-object -t tree /dev/null)
              fi
              git -c safe.directory=/tmp/workspace diff --check "$base" "$CHECK_HEAD"
            '
      - name: Installed-artifact test
        run: |
          ARTIFACT_ROOT=$(mktemp -d /tmp/loopzero-artifacts-XXXXXX)
          trap 'rm -rf -- "$ARTIFACT_ROOT"' EXIT
          UV_BIN=$(command -v uv)

          bwrap --unshare-user --unshare-net --ro-bind / / --tmpfs /tmp --dev /dev --proc /proc \
            --ro-bind "$GITHUB_WORKSPACE" /tmp/workspace \
            --bind "$ARTIFACT_ROOT" /artifacts \
            --uid "$(id -u)" --gid "$(id -g)" --cap-drop ALL --clearenv \
            --setenv PATH /usr/bin:/bin --setenv PYTHONDONTWRITEBYTECODE 1 --setenv HOME /tmp \
            --setenv UV_BIN "$UV_BIN" --chdir /tmp/workspace -- bash -eu -c '
              "$UV_BIN" build --offline --no-cache --no-build-isolation \
                --python /tmp/workspace/.venv/bin/python --out-dir /artifacts/dist /tmp/workspace
              test "$(find /artifacts/dist -maxdepth 1 -name "*.whl" | wc -l)" -eq 1
              test "$(find /artifacts/dist -maxdepth 1 -name "*.tar.gz" | wc -l)" -eq 1
              "$UV_BIN" venv --python /tmp/workspace/.venv/bin/python /artifacts/wheel-venv
              "$UV_BIN" pip install --offline --no-cache \
                --python /artifacts/wheel-venv/bin/python /artifacts/dist/*.whl
              "$UV_BIN" venv --python /tmp/workspace/.venv/bin/python /artifacts/sdist-venv
              build_site=$(/tmp/workspace/.venv/bin/python -c \
                "import sysconfig; print(sysconfig.get_paths()[\"purelib\"])")
              PYTHONPATH="$build_site" "$UV_BIN" pip install --offline --no-cache \
                --no-build-isolation --python /artifacts/sdist-venv/bin/python \
                /artifacts/dist/*.tar.gz
            '

          bwrap --unshare-user --unshare-net --ro-bind / / --tmpfs /tmp --dev /dev --proc /proc \
            --ro-bind "$GITHUB_WORKSPACE" /tmp/workspace \
            --ro-bind "$ARTIFACT_ROOT" /artifacts \
            --uid "$(id -u)" --gid "$(id -g)" --cap-drop ALL --clearenv \
            --setenv PATH /artifacts/wheel-venv/bin:/usr/bin:/bin \
            --setenv PYTHONDONTWRITEBYTECODE 1 --setenv HOME /tmp \
            --chdir /tmp -- bash -eu -c '
              test "$(/artifacts/wheel-venv/bin/loopzero --version | awk "{print \$2}")" = \
                "$(cat /tmp/workspace/core/VERSION)"
              test "$(/artifacts/sdist-venv/bin/loopzero --version | awk "{print \$2}")" = \
                "$(cat /tmp/workspace/core/VERSION)"
              cp -R /tmp/workspace/tests/example_consumer /tmp/consumer
              mkdir -p /tmp/consumer/vendor
              cp -R /tmp/workspace/core /tmp/consumer/vendor/loop-zero
              if /artifacts/wheel-venv/bin/loopzero --root /tmp/consumer sync --check; then
                echo "expected initial sync drift" >&2
                exit 1
              else
                test "$?" -eq 1
              fi
              /artifacts/wheel-venv/bin/loopzero --root /tmp/consumer sync
              /artifacts/wheel-venv/bin/loopzero --root /tmp/consumer sync --check
              /artifacts/wheel-venv/bin/loopzero --root /tmp/consumer checks
              status_output=$(/artifacts/wheel-venv/bin/loopzero --root /tmp/consumer status)
              printf "%s\n" "$status_output"
              ! grep -qw pass <<<"$status_output"
            '
