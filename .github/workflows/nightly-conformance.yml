# The trusted release wheel seals credentials on the host before checked-out
# code starts.  The validation bubble receives only a short-lived access token;
# checked-out code on main can read that residual token while network is enabled.
name: nightly real-runtime conformance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.runtime }} conformance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: nightly-conformance
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: claude
            version: "2.1.269"
            secret: LOOPZERO_CONFORMANCE_CLAUDE_CREDENTIAL
          - runtime: codex
            version: "0.154.0"
            secret: LOOPZERO_CONFORMANCE_CODEX_CREDENTIAL
          - runtime: cursor
            version: "2026.09.08"
            build: "6caf4ff"
            secret: LOOPZERO_CONFORMANCE_CURSOR_CREDENTIAL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and containment
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Resolve locked Python environment
        run: |
          uv python install 3.13
          VENV_ROOT="$RUNNER_TEMP/loopzero-live/.venv"
          UV_CACHE_ROOT="$RUNNER_TEMP/loopzero-live/uv-cache"
          mkdir -p "$UV_CACHE_ROOT"
          UV_CACHE_DIR="$UV_CACHE_ROOT" UV_PROJECT_ENVIRONMENT="$VENV_ROOT" \
            uv sync --locked --python 3.13 --group dev --no-install-project

      - name: Build and install pinned release credential broker
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -eu
          ROOT="$RUNNER_TEMP/loopzero-live"
          RELEASE_SOURCE="$ROOT/release-source"
          WHEEL_DIR="$ROOT/release-wheel"
          BROKER_VENV="$ROOT/broker-venv"
          RELEASE_SHA=$(git rev-parse 'refs/remotes/origin/release/0.3^{commit}')
          install -d -m 700 "$RELEASE_SOURCE" "$WHEEL_DIR"
          git archive --format=tar "$RELEASE_SHA" | tar -xf - -C "$RELEASE_SOURCE"
          UV_CACHE_DIR="$ROOT/uv-cache" uv build --wheel \
            --out-dir "$WHEEL_DIR" "$RELEASE_SOURCE"
          uv venv --python 3.13 "$BROKER_VENV"
          WHEEL=$(find "$WHEEL_DIR" -maxdepth 1 -type f -name 'loopzero-*.whl' -print)
          test -n "$WHEEL" && test "$(printf '%s\n' "$WHEEL" | wc -l)" -eq 1
          INSTALL_TARGET="$WHEEL"
          if [ "$RUNTIME" = codex ]; then
            INSTALL_TARGET="$WHEEL[codex]"
          fi
          UV_CACHE_DIR="$ROOT/uv-cache" uv pip install \
            --python "$BROKER_VENV/bin/python" "$INSTALL_TARGET"
          test -x "$BROKER_VENV/bin/loopzero-credential-seal"
          printf 'LOOPZERO_RELEASE_SHA=%s\n' "$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Install exact runtime pin
        env:
          RUNTIME: ${{ matrix.runtime }}
          VERSION: ${{ matrix.version }}
          CURSOR_BUILD: ${{ matrix.build }}
        run: |
          set -eu
          RUNTIME_ROOT="$RUNNER_TEMP/loopzero-live/runtime"
          mkdir -p "$RUNTIME_ROOT/bin"
          case "$RUNTIME" in
            claude)
              NPM_CONFIG_CACHE="$RUNNER_TEMP/loopzero-live/npm-cache" \
                npm install --prefix "$RUNTIME_ROOT" \
                  "@anthropic-ai/claude-code@$VERSION"
              CLI_PATH="$RUNTIME_ROOT/node_modules/.bin/claude"
              ;;
            codex)
              SOURCE_CLI=$("$RUNNER_TEMP/loopzero-live/.venv/bin/python" -c \
                'from importlib.metadata import distribution; d=distribution("openai-codex-cli-bin"); print(next(d.locate_file(f) for f in d.files if str(f).endswith("/codex")))')
              cp "$SOURCE_CLI" "$RUNTIME_ROOT/bin/codex"
              chmod 755 "$RUNTIME_ROOT/bin/codex"
              CLI_PATH="$RUNTIME_ROOT/bin/codex"
              ;;
            cursor)
              curl -fsSL \
                "https://downloads.cursor.com/lab/${VERSION}-${CURSOR_BUILD}/linux/x64/agent-cli-package.tar.gz" \
                | tar --strip-components=1 -xzf - -C "$RUNTIME_ROOT"
              CLI_PATH="$RUNTIME_ROOT/cursor-agent"
              chmod 755 "$CLI_PATH"
              ;;
          esac
          test -x "$CLI_PATH"
          printf 'LOOPZERO_LIVE_CLI_PATH=%s\n' "$CLI_PATH" >> "$GITHUB_ENV"
          printf 'LOOPZERO_LIVE_RUNTIME_ROOT=%s\n' "$RUNTIME_ROOT" >> "$GITHUB_ENV"

      - name: Seal access-only credential on the host
        env:
          LIVE_CREDENTIAL: ${{ secrets[matrix.secret] }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -eu
          if [ -z "$LIVE_CREDENTIAL" ]; then
            echo "missing required environment secret ${{ matrix.secret }}" >&2
            exit 1
          fi
          ROOT="$RUNNER_TEMP/loopzero-live"
          SOURCE="$ROOT/credential-source.json"
          SNAPSHOT="$ROOT/credential-snapshot.json"
          install -d -m 700 "$ROOT"
          umask 077
          trap 'rm -f -- "$SOURCE"' EXIT
          printf '%s' "$LIVE_CREDENTIAL" > "$SOURCE"
          chmod 600 "$SOURCE"
          PATH="$RUNNER_TEMP/loopzero-live/broker-venv/bin:/usr/bin:/bin" \
            LOOPZERO_LIVE_RUNTIME_ROOT="$LOOPZERO_LIVE_RUNTIME_ROOT" \
            LOOPZERO_LIVE_CLI_PATH="$LOOPZERO_LIVE_CLI_PATH" \
            "$RUNNER_TEMP/loopzero-live/broker-venv/bin/loopzero-credential-seal" \
              "$RUNTIME" --source "$SOURCE" --out "$SNAPSHOT"
          rm -f -- "$SOURCE"
          trap - EXIT
          test ! -e "$SOURCE"
          test -f "$SNAPSHOT"
          test "$(stat -c '%a' "$SNAPSHOT")" = 600

      - name: Run live scenarios in the validation bubble
        env:
          LOOPZERO_LIVE_RUNTIMES: ${{ matrix.runtime }}
          BUDGET_USD: ${{ vars.LOOPZERO_CONFORMANCE_BUDGET_USD }}
        run: |
          set -eu
          ROOT="$RUNNER_TEMP/loopzero-live"
          SNAPSHOT="$ROOT/credential-snapshot.json"
          RESULTS="$ROOT/results"
          mkdir -p "$RESULTS"
          trap 'rm -f -- "$SNAPSHOT"' EXIT
          test -f "$SNAPSHOT"
          test ! -e "$ROOT/credential-source.json"
          ACCOUNT_HOME=$(getent passwd "$(id -u)" | cut -d: -f6)
          test -n "$ACCOUNT_HOME" && test "$ACCOUNT_HOME" != /
          PYTHON_BIN=$(readlink -f "$(uv python find 3.13)")
          PYTHON_INSTALL_ROOT=${PYTHON_BIN%/bin/*}
          test "$PYTHON_INSTALL_ROOT" != "$PYTHON_BIN"
          PYTHON_ALIAS_LAYOUT=()
          PYTHON_ALIAS_PATHS=()
          for interpreter in "$ROOT"/.venv/bin/python*; do
            if [ -L "$interpreter" ]; then
              raw_target=$(readlink "$interpreter")
              case "$raw_target" in
                /*) ;;
                *) raw_target=$(dirname "$interpreter")/"$raw_target" ;;
              esac
              resolved_target=$(readlink -f "$raw_target")
              case "$resolved_target" in
                "$PYTHON_INSTALL_ROOT"/*) ;;
                *) echo "venv interpreter escapes uv install root" >&2; exit 1 ;;
              esac
              dir=$(dirname "$raw_target")
              while [ "$dir" != "$ACCOUNT_HOME" ]; do
                case "$dir" in
                  "$ACCOUNT_HOME"/*) ;;
                  *) break ;;
                esac
                if [ -L "$dir" ]; then
                  seen=false
                  for known in "${PYTHON_ALIAS_PATHS[@]}"; do
                    if [ "$known" = "$dir" ]; then
                      seen=true
                      break
                    fi
                  done
                  if [ "$seen" = false ]; then
                    PYTHON_ALIAS_LAYOUT+=(--symlink "$(readlink "$dir")" "$dir")
                    PYTHON_ALIAS_PATHS+=("$dir")
                  fi
                fi
                next=$(dirname "$dir")
                test "$next" != "$dir"
                dir="$next"
              done
            fi
          done
          PYTHON_ROOT_LAYOUT=()
          parent=$(dirname "$PYTHON_INSTALL_ROOT")
          while [ "$parent" != "$ACCOUNT_HOME" ]; do
            PYTHON_ROOT_LAYOUT=(--dir "$parent" "${PYTHON_ROOT_LAYOUT[@]}")
            next=$(dirname "$parent")
            test "$next" != "$parent"
            parent="$next"
          done
          ROOT_LAYOUT=()
          for entry in /bin /lib /lib64 /sbin; do
            if [ -L "$entry" ]; then
              ROOT_LAYOUT+=(--symlink "$(readlink "$entry")" "$entry")
            elif [ -d "$entry" ]; then
              ROOT_LAYOUT+=(--ro-bind "$entry" "$entry")
            fi
          done
          EFFECTIVE_BUDGET=${BUDGET_USD:-2}
          # Provider version/readiness probes and paid scenarios need outbound
          # network. Deliberately omit --unshare-net; the positive filesystem
          # mounts, child wrapper, private namespaces, and capability drop stay.
          bwrap --unshare-user --unshare-pid --unshare-ipc --unshare-uts \
            --die-with-parent --ro-bind /usr /usr "${ROOT_LAYOUT[@]}" \
            --ro-bind /etc/alternatives /etc/alternatives \
            --ro-bind /etc/ssl /etc/ssl --ro-bind /etc/ld.so.cache /etc/ld.so.cache \
            --ro-bind /etc/passwd /etc/passwd --ro-bind /etc/group /etc/group \
            --ro-bind /etc/hosts /etc/hosts --ro-bind /etc/resolv.conf /etc/resolv.conf \
            --tmpfs /tmp --tmpfs /run --tmpfs /var/run --dev /dev --proc /proc \
            --ro-bind "$GITHUB_WORKSPACE" /tmp/workspace \
            --ro-bind "$ROOT/.venv" /tmp/venv \
            --perms 0700 --tmpfs "$ACCOUNT_HOME" "${PYTHON_ROOT_LAYOUT[@]}" \
            "${PYTHON_ALIAS_LAYOUT[@]}" \
            --ro-bind "$PYTHON_INSTALL_ROOT" "$PYTHON_INSTALL_ROOT" \
            --ro-bind "$LOOPZERO_LIVE_RUNTIME_ROOT" /opt/runtime \
            --bind "$RESULTS" /tmp/results \
            --ro-bind "$SNAPSHOT" /run/loopzero-credential.json \
            --uid "$(id -u)" --gid "$(id -g)" --cap-drop ALL --clearenv \
            --setenv PATH /opt/runtime/bin:/usr/bin:/bin \
            --setenv HOME /tmp --setenv PYTHONDONTWRITEBYTECODE 1 \
            --setenv LOOPZERO_LIVE_RUNTIMES "$LOOPZERO_LIVE_RUNTIMES" \
            --setenv LOOPZERO_LIVE_CLI_PATH "/opt/runtime/${LOOPZERO_LIVE_CLI_PATH#"$LOOPZERO_LIVE_RUNTIME_ROOT"/}" \
            --setenv LOOPZERO_LIVE_RUNTIME_ROOT /opt/runtime \
            --setenv LOOPZERO_LIVE_PYTHON /tmp/venv/bin/python \
            --setenv LOOPZERO_LIVE_CREDENTIAL_PATH /run/loopzero-credential.json \
            --setenv LOOPZERO_LIVE_STATE_ROOT "$ACCOUNT_HOME/.local/state/loopzero-live" \
            --setenv LOOPZERO_CONFORMANCE_BUDGET_USD "$EFFECTIVE_BUDGET" \
            --setenv LOOPZERO_CONFORMANCE_MAX_KILLED_RUNS 3 \
            --setenv LOOPZERO_CONFORMANCE_MAX_UNACCOUNTED_RUNS 3 \
            --setenv LOOPZERO_LIVE_RESULTS "/tmp/results/${LOOPZERO_LIVE_RUNTIMES}.json" \
            --chdir /tmp/workspace -- bash -eu -c '
              /tmp/venv/bin/python -m pytest -q -s -p no:cacheprovider \
                --basetemp=/tmp/pytest-diagnose --diagnose \
                tests/conformance/live/live_conformance.py
              /tmp/venv/bin/python -m pytest -q -p no:cacheprovider \
                --basetemp=/tmp/pytest tests/conformance/live/live_conformance.py
            '

      - name: Add normalized summary
        if: always()
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          RESULT="$RUNNER_TEMP/loopzero-live/results/$RUNTIME.json"
          if [ ! -f "$RESULT" ]; then
            echo "### $RUNTIME: no normalized result artifact" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          "$RUNNER_TEMP/loopzero-live/.venv/bin/python" - "$RESULT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write(f"### {result['runtime']} {result['version']}\n\n")
              summary.write("| Scenario | Outcome | Cost source(s) | Accounting | Charged cost (USD) |\n|---|---:|---|---|---:|\n")
              for row in result["scenarios"]:
                  cost = row.get("charged_cost_usd")
                  sources = ", ".join(row.get("cost_sources", ())) or "n/a"
                  summary.write(f"| {row['scenario']} | {row['outcome']} | {sources} | {row.get('accounting', 'n/a')} | {cost if cost is not None else 'n/a'} |\n")
              summary.write(f"\nTotal charged cost: ${result['charged_cost_usd']:.6f}\n\n")
              summary.write(f"Killed runs: {result['killed_runs']}/{result['max_killed_runs']}\n\n")
              summary.write(f"Unaccounted runs: {result['unaccounted_runs']}/{result['max_unaccounted_runs']}\n\n")
              summary.write(f"Spend bound: {result['spend_bound']}\n")
          PY

      - name: Upload normalized conformance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-conformance-${{ matrix.runtime }}
          path: ${{ runner.temp }}/loopzero-live/results/${{ matrix.runtime }}.json
          if-no-files-found: error
