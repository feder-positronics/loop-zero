# Unprivileged notification only. The trusted workflow_run consumer re-fetches metadata.
name: review event
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  # Comments created inside a review also fire its submitted event; only edits and
  # deletions of existing finding comments need their own refresh.
  pull_request_review_comment:
    types: [edited, deleted]
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - run: 'true'
