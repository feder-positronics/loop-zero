name: review eligibility
run-name: "${{ inputs.pr && format('Refresh eligibility for PR #{0}', inputs.pr) || '' }}"
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [review event]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to refresh after supported review/thread changes
        required: true
        type: string
permissions: {}
jobs:
  # Only candidate attestation reads the Mergify queue, so only that job carries the
  # Mergify credential and its main-only environment. Source PRs never wait on that
  # environment, whose deployment gate intermittently hangs on GitHub's side.
  # loopzero.hosted classifies the PR itself; a candidate event that reached the keyless
  # job would fail closed (no MERGIFY_API_KEY) and publish a failure, never a pass.
  source-eligibility:
    # Skip closed PRs and title/body edits before a runner is allocated. Draft churn
    # waits for readiness except when conversion or a hold change needs a refresh.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.action != 'closed' &&
        (!github.event.pull_request.draft || github.event.action == 'converted_to_draft' ||
         github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        (github.event.action != 'edited' || github.event.changes.base != null) &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
         github.event.label.name == 'hold') &&
        github.event.pull_request.user.login != 'mergify[bot]' &&
        !startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/'))
    # Skipped events stay out of the group and cannot replace a pending refresh.
    concurrency:
      group: eligibility-source-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || format('run-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Never run candidate code or consume artifacts from the notifying workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          checksum: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
      - name: Evaluate live source metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: uv run --python 3.14 --frozen --no-dev python -m loopzero.hosted

  candidate-eligibility:
    # Only candidate creation and head-update events need attestation.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.pull_request.user.login == 'mergify[bot]' ||
        startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')) &&
      (github.event.action == 'opened' || github.event.action == 'synchronize')
    # Separate actions so a synchronize event cannot replace a pending opened run.
    concurrency:
      group: eligibility-candidate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || format('run-{0}', github.run_id) }}-${{ github.event.action }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: mergify-metadata
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Never run candidate code or consume artifacts from the notifying workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
          checksum: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
      - name: Attest live candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MERGIFY_API_KEY: ${{ secrets.MERGIFY_API_KEY }}
          PYTHONPATH: src
        run: uv run --python 3.14 --frozen --no-dev python -m loopzero.hosted
