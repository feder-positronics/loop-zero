name: review eligibility
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [review event]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to refresh after supported review/thread changes
        required: true
        type: string
permissions: {}
concurrency:
  group: eligibility-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
  cancel-in-progress: false
jobs:
  eligibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Never run candidate code or consume artifacts from the notifying workflow.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Evaluate live source or candidate metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MERGIFY_API_KEY: ${{ secrets.MERGIFY_API_KEY }}
          PYTHONPATH: src
        run: uv run --python 3.14 --no-project python -m loopzero.hosted
