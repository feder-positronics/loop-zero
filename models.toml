# Selected model profiles and suggested task routes.
# Owner-selected defaults (2026-09-19; Sol 6.1 and Sonnet 5.5 routes 2026-09-30).
# Profile names describe task shape; they do not claim a measured ranking of
# model prices or speeds.
# Agents read this file before delegation, check runtime support, and explicitly
# pass the selected model and effort. This file does not launch models by itself.
version = 1

[profiles.fast]
provider = "openai"
model = "gpt-6-luna"
effort = "xhigh"

[[profiles.fast.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "low"

[profiles.standard]
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"

# Model IDs and efforts pass through unchanged; runtime aliases
# are resolved by the runtime. Validate support before launch. Alternatives are choices,
# not automatic retries or replacements for an explicitly requested model.
[[profiles.standard.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
# Sonnet 5.5 reroutes high-risk security prompts to Sonnet 5; choose another route
# for security-sensitive work. Avoid Sonnet max and Sol ultra: both fan out to subagents.

[profiles.deep]
provider = "openai"
model = "gpt-6-astra"
effort = "medium"

[[profiles.deep.alternatives]]
provider = "anthropic"
model = "claude-fable-5-1"
effort = "low"

# UI and UX design, including frontend work whose main decisions are layout,
# interaction or visual design.
[profiles.design]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[[profiles.design.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"

# Provider preferences (owner, 2026-09-30); they limit which alternatives apply:
# - Exhaustive review and audits, where finding every detail matters, stay on
#   OpenAI; choose an OpenAI profile rather than an Anthropic alternative.
#   Checking such findings with the other family is a separate step.
# - UI design always uses Anthropic models (the design profile).
# Categories suggest a starting profile; task requirements may justify another.
# The review profile does not replace independent-review requirements.
[categories]
mechanical = "fast"
bounded_implementation = "fast" # One settled behavior with direct acceptance.
implementation = "standard" # Cohesive work with several connected decisions.
investigation = "standard"
planning = "deep"
architecture = "deep"
review = "deep"
audit = "deep" # Exhaustive search for defects or gaps; OpenAI only.
ui_design = "design" # Anthropic only.
