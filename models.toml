# Owner-selected task routes (2026-09-19; Sonnet 5.5 routes 2026-09-30; Sol and Astra 6.2 2026-11-18);
# provider preferences below are owner rules (2026-09-30). Profile names do not rank cost or speed.
# Read before delegation; check runtime support and pass model/effort explicitly.
# Effort: avoid max/ultra; xhigh only where it measurably helps.
# OpenAI remains the default for builders and the only provider for finishers,
# CI fixes and audits.
# Anthropic is reserved for UI design and cross-family review or consultation.
# Gemini 4 Neon is an explicit option for substantial coding and critical
# analysis, with root-cause diagnosis as its specialty. Antigravity consumer
# plans require directly prompted sessions. See docs/DELEGATION.md.
# Values pass through; runtimes resolve aliases. Alternatives are explicit choices,
# not automatic retries or replacements for an explicitly requested model.
version = 1

[profiles.fast]
provider = "openai"
model = "gpt-6-luna"
effort = "xhigh"

[[profiles.fast.alternatives]]
provider = "openai"
model = "gpt-6.2-sol"
effort = "medium"

[profiles.standard]
provider = "openai"
model = "gpt-6.2-sol"
effort = "medium"

[[profiles.standard.alternatives]]
provider = "openai"
model = "gpt-6.2-astra"
effort = "medium"

[[profiles.standard.alternatives]]
provider = "antigravity"
model = "gemini-4-neon"
effort = "high"

[profiles.deep]
provider = "openai"
model = "gpt-6.2-astra"
effort = "medium"

# Anthropic here only for a cross-family review or consult, never a builder.
[[profiles.deep.alternatives]]
provider = "anthropic"
model = "claude-fable-5-2"
effort = "low"

[[profiles.deep.alternatives]]
provider = "antigravity"
model = "gemini-4-neon"
effort = "high"

# Prefer Neon for directly prompted diagnosis. Astra is the agent-driven default.
[profiles.diagnosis]
provider = "openai"
model = "gpt-6.2-astra"
effort = "medium"

[[profiles.diagnosis.alternatives]]
provider = "antigravity"
model = "gemini-4-neon"
effort = "high"

# Exhaustive defect/gap search: thorough, potentially noisy; OpenAI only, so do not
# choose another provider. If no OpenAI route is available, ask the owner.
[profiles.audit]
provider = "openai"
model = "gpt-6.2-sol"
effort = "high"

[[profiles.audit.alternatives]]
provider = "openai"
model = "gpt-6.2-astra"
effort = "medium"

# UI/UX design and frontend layout/interaction decisions: Anthropic only.
[profiles.design]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[[profiles.design.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"

# Categories are starting points. Provider constraints above limit alternatives.
# Exhaustive reviews/audits stay on OpenAI; other-family finding checks are separate.
# The review route does not replace independent-review requirements.
[categories]
mechanical = "fast"
bounded_implementation = "fast" # One settled behavior with direct acceptance.
implementation = "standard" # Several connected decisions.
investigation = "standard"
root_cause_analysis = "diagnosis"
planning = "deep"
architecture = "deep"
review = "deep"
audit = "audit"
ui_design = "design"
