# Owner-selected task routes (2026-09-19; Sol 6.1 and Sonnet 5.5 routes 2026-09-30);
# provider preferences below are owner rules (2026-09-30). Profile names do not rank cost or speed.
# Read before delegation; check runtime support and pass model/effort explicitly.
# Effort: avoid max/ultra; xhigh only where it measurably helps.
# Values pass through; runtimes resolve aliases. Alternatives are explicit choices,
# not automatic retries or replacements for an explicitly requested model.
version = 1

[profiles.fast]
provider = "openai"
model = "gpt-6-luna"
effort = "xhigh"

[[profiles.fast.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"

[profiles.standard]
provider = "openai"
model = "gpt-6.1-sol"
effort = "medium"

[[profiles.standard.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"
# Sonnet 5.5 reroutes high-risk security prompts to Sonnet 5; use another route.

[profiles.deep]
provider = "openai"
model = "gpt-6-astra"
effort = "medium"

[[profiles.deep.alternatives]]
provider = "anthropic"
model = "claude-fable-5-1"
effort = "low"

# Exhaustive defect/gap search: thorough, potentially noisy; OpenAI only, so do not
# choose an Anthropic alternative. If no OpenAI route is available, ask the owner.
[profiles.audit]
provider = "openai"
model = "gpt-6.1-sol"
effort = "high"

[[profiles.audit.alternatives]]
provider = "openai"
model = "gpt-6-astra"
effort = "medium"

# UI/UX design and frontend layout/interaction decisions: Anthropic only.
[profiles.design]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[[profiles.design.alternatives]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"

# Categories are starting points. Provider constraints above limit alternatives.
# Exhaustive reviews/audits stay on OpenAI; other-family finding checks are separate.
# The review route does not replace independent-review requirements.
[categories]
mechanical = "fast"
bounded_implementation = "fast" # One settled behavior with direct acceptance.
implementation = "standard" # Several connected decisions.
investigation = "standard"
planning = "deep"
architecture = "deep"
review = "deep"
audit = "audit"
ui_design = "design"
