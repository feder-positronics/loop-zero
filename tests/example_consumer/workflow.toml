# Example consumer used by the conformance and installed-artifact tests.
# Commands run from the repository root; narrow checks to the affected area.
profiles = ["python"]

[core]
repository = "https://github.com/feder-positronics/loop-zero"
revision = "0123456789abcdef0123456789abcdef01234567"
path = "vendor/loop-zero"

[package]
env_prefix = "INTELFLO"
audit_root = ".audit"
state_root = "~/.local/state/intelflo"
contract = "loop-zero-v1"
epoch = 1
sandbox = "bwrap"

[checks]
required = ["unit"]
advisory = []
scheduled = ["health"]

[paths]
source = "src"
tests = "tests"
constraints = "AGENTS.md"

[commands]
setup = ["python3 -m venv .venv"]
check_fast = ["python3 -m unittest discover -s tests"]
check_integration = "not-applicable: fixture repository, no integration behavior"

[toolchain]
interpreter = ".venv/bin/python"
shared_artifacts = [".venv"]
dotenv = ".env"
db_url_vars = ["TEST_DATABASE_URL", "DATABASE_URL"]
db_default_url = "postgresql://localhost:5433/test_db"
db_lock = "/tmp/intelflo-testdb-5433.lock"
db_targets = ["test-integration"]
trusted_bin_dir = "/usr/bin"
closeout_launcher_path = "scripts/util/pr_closeout.py"
closeout_snapshot_path = "vendor/loop-zero"
closeout_temp_prefix = "example-closeout-"
closeout_trust_floor_path = "scripts/util/pr_closeout_trust_floor.json"

[routing]
policy_version = "2026-08-17-v11"
telemetry_schema_version = "dispatch-telemetry-v9"
compatible_policy_versions = ["2026-07-24-v9", "2026-08-06-v10", "2026-08-17-v11"]
default_timeout_s = 900
engine_cooldown_s = 600

[routing.budgets]
medium = 5.0
high = 10.0

[review]
max_reviews_per_pr = 1
max_delta_reviews = 1
required_sections = ["code", "security"]
finding_severities = ["critical", "important", "suggestion"]
security_patterns = ["*dependencies*.py", "*middleware*", "*/integrations/*", "*config.py", "*.env*"]
review_snapshot_namespace = "dispatch-snapshots"
finding_snapshot_namespace = "finding-snapshots"

[github]
native_protection = true
workflow = ".github/workflows/ci.yml"
labels = { in_progress = "in-progress", blocked = "blocked", standalone = "standalone" }
check_commands = { test = "make test", test_be = "make test-be", test_fe = "make test-fe" }
ref_namespace = "refs/heads"
gh_version_floor = "2.40.0"
retries = 2
body_required_sections = ["Context and goal", "Validation"]

[hooks]
worktree_setup = ["bash -c true"]
acceptance = ["bash -c \"python3 -m unittest discover -s tests\""]
