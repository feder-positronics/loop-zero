# loop-zero's own delivery configuration. See workflow.example.toml for key docs.

[repo]
name = "feder-positronics/loop-zero"
base = "main"

[checks]
# Omit scratch to use the built-in default directories.
commands = [
  "uv run --group dev ruff check src tests scripts",
  "uv run --group dev tach check",
  "uv run --python 3.14 python scripts/check_architecture_docs.py",
  "scripts/size_budget.sh", # Same script and caps as CI; base is the merge-base with origin/main.
  "uv run --group dev pytest -n 14",
]
required_ci = ["checks", "Loop-zero Eligibility"]
ro_paths = ["/home/marcin/.local/bin", "/home/marcin/.local/share/uv"]
writable = ["/home/marcin/.cache/uv"]
# UV_PYTHON/UV_LOCKED match CI's --python 3.14 --locked and keep the offline sync stage.
env = { UV_PYTHON = "3.14", UV_LOCKED = "1", UV_CACHE_DIR = "/home/marcin/.cache/uv", UV_PYTHON_INSTALL_DIR = "/home/marcin/.local/share/uv/python" }
network = false

[delivery]
merge = "mergify"
mergify_queue = "main"
reviewers = ["claude", "codex"]
# Only the loopzero GitHub App publishes trusted reviews (cutover #235, 2026-10-19).
review_publishers = ["loopzero-feder-positronics[bot]"]

# Owner policy (2026-09-19): Opus at medium; use high exceptionally, with a concrete
# reason in the PR. Codex follows models.toml `review = "deep"`.
[delivery.review.claude]
model = "claude-opus-5-5"
effort = "medium"
allowed_efforts = ["low", "medium", "high"]

[delivery.review.codex]
model = "gpt-6.2-astra"
effort = "medium"
allowed_efforts = ["low", "medium", "high", "xhigh"]
