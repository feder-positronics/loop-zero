# loop-zero's own delivery configuration. See workflow.example.toml for key docs.

[repo]
name = "feder-positronics/loop-zero"
base = "v2/minimal-rewrite"

[checks]
# test_bwrap_flags asserts HOME differs from the host HOME, which is false when the
# suite itself runs inside the loopzero sandbox (HOME=/tmp/home); skip it here only.
commands = [
  "uv run --group dev ruff check src tests",
  "uv run --group dev pytest -q --deselect tests/test_sandbox.py::test_bwrap_flags",
]
required_ci = ["checks"]
ro_paths = ["/home/marcin/.local/bin", "/home/marcin/.local/share/uv", "/home/marcin/.cache/uv"]
network = false

[delivery]
merge = "squash"
reviewers = ["claude", "codex"]
