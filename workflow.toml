# loop-zero's own delivery configuration. See workflow.example.toml for key docs.

[repo]
name = "feder-positronics/loop-zero"
base = "main"

[checks]
# Omit scratch to use the built-in default directories.
commands = [
  "uv run --group dev ruff check src tests",
  "uv run --group dev pytest -q",
  "scripts/size_budget.sh", # Same script and caps as CI; base is the merge-base with origin/main.
]
required_ci = ["checks", "Loop-zero Eligibility"]
ro_paths = ["/home/marcin/.local/bin", "/home/marcin/.local/share/uv"]
writable = ["/home/marcin/.cache/uv"]
env = { UV_CACHE_DIR = "/home/marcin/.cache/uv", UV_PYTHON_INSTALL_DIR = "/home/marcin/.local/share/uv/python" }
network = false

[delivery]
merge = "mergify"
mergify_queue = "main"
reviewers = ["claude", "codex"]
# eowca stays trusted during the one-week switch to the loopzero GitHub App (owner approval 2026-09-24).
review_publishers = ["eowca", "loopzero-feder-positronics[bot]"]

# Owner policy (2026-09-19): Opus at medium; use high exceptionally, with a concrete
# reason in the PR; max is forbidden (the Luna exception is not enabled here because the
# allow-list is per family). Codex follows models.toml `review = "deep"`.
[delivery.review.claude]
model = "claude-opus-5-5"
effort = "medium"
allowed_efforts = ["low", "medium", "high"]

[delivery.review.codex]
model = "gpt-6-astra"
effort = "medium"
allowed_efforts = ["low", "medium", "high", "xhigh"]
