[project]
name = "loopzero"
description = "Executable mechanisms of the loop-zero shared agent workflow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2.151"]
codex = ["openai-codex>=0.147.0"]
acp = ["agent-client-protocol>=0.12"]
guardian = ["PyYAML>=6"]

[project.scripts]
loopzero = "loopzero.cli:main"

[project.urls]
Repository = "https://github.com/feder-positronics/loop-zero"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "core/VERSION"
pattern = "^(?P<version>.+?)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/loopzero"]

[tool.hatch.build.targets.sdist]
include = ["src/loopzero", "core/VERSION", "README.md", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
