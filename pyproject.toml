[project]
name = "loopzero"
description = "Minimal delivery toolkit for repository-based coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
version = "2.0.0a0"
dependencies = []

[project.scripts]
loopzero = "loopzero.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopzero"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
