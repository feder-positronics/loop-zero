[project]
name = "loopzero"
description = "Minimal delivery toolkit for repository-based coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
version = "2.0.0a0"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
loopzero = "loopzero._cli_entry:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopzero"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "tach>=0.35.3,<0.36"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:tach"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "UP", "B", "SIM", "PIE", "PERF", "RUF", "RET",
    "ERA", "ARG", "PGH003", "PGH004", "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "C901"]
"scripts/**" = ["C901"]
